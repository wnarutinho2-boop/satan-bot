name: satan
on:
  workflow_dispatch:
  push:                      # editar/arquivar pelo site do GitHub religa o bot na hora
    paths-ignore:
      - 'nuke_state.json'    # commit de estado NAO religa o bot
      - 'bump_state.json'
      - 'mute_state.json'
      - 'fake_state.json'
  schedule:
    - cron: '5 */6 * * *'    # religa sozinho a cada 6h (job maximo = 6h)
concurrency:
  group: satan
  cancel-in-progress: true   # run novo mata o antigo (update via .att troca o bot sem duplicar)
permissions:
  contents: write            # pro .att commitar arquivo novo no repo
jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: bot (loop infinito; .att reinicia com o codigo novo)
        run: |
          while true; do
            npm i --no-audit --no-fund
            node bot.js
            echo "[loop] bot saiu, religando em 2s..."
            sleep 2
          done
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
